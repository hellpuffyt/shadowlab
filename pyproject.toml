[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowlab"
version = "0.1.0"
description = "A local, offline defensive-security exercise runner: log analysis, config audit, and incident-response scenarios with scored outcomes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prabesh Sharma" }]
keywords = ["security", "blue-team", "training", "log-analysis", "incident-response"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Education :: Testing",
]
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6"]

[project.scripts]
shadowlab = "shadowlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shadowlab = [
    "scenarios/**/*.json",
    "scenarios/**/*.log",
    "scenarios/**/*.md",
    "scenarios/**/*.csv",
    "scenarios/**/*.v4",
    "scenarios/**/sshd_config",
    "scenarios/**/*.rules",
]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["shadowlab"]
mypy_path = "src"

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["shadowlab"]
